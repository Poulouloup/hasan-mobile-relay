# Déploiement Docker du bridge Hasan (relay, et Caddy si besoin) — voir
# install.sh, qui choisit les services et les fichiers à combiner.
name: hasan-bridge

services:
  relay:
    build: ./relay
    # Nom fixe : c'est par lui qu'un reverse proxy en réseau Docker joint le
    # relay (hasan-relay:8767) — voir docker-compose.network.yml, généré par
    # install.sh quand un Caddy existant est sur un réseau Docker classique.
    container_name: hasan-relay
    env_file: .env
    ports:
      # Publié sur la boucle locale de l'hôte seulement : pour le plugin
      # Hermès (HASAN_RELAY_URL=http://127.0.0.1:8767) et pour un reverse
      # proxy en réseau hôte. Jamais sur une interface publique — le relay ne
      # fait pas de TLS, c'est le rôle du reverse proxy.
      - "127.0.0.1:8767:8767"
    volumes:
      # Sessions de pairing (device_hash, tokens) — DEFAULT_SESSIONS_PATH de
      # pairing.py pointe vers ~/.hermes/... du process, qui est éphémère
      # dans le conteneur sans ce volume : sans lui, tout pairing existant
      # est perdu à chaque recréation du conteneur. RELAY_SESSIONS_PATH dans
      # .env doit pointer vers /data/sessions.json (voir install.sh).
      - relay_data:/data
    restart: unless-stopped

  # Lancé seulement si aucun reverse proxy ne tient déjà le port 443
  # (install.sh active alors le profil « caddy »).
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    # Réseau hôte : ce Caddy joint le relay (port publié ci-dessus) et
    # hermes-webui sur 127.0.0.1, comme des process natifs.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificats Let's Encrypt et compte ACME — sans ce volume, chaque
      # recréation du conteneur redemande des certificats et finit par buter
      # sur les limites de débit de Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  relay_data:
  caddy_data:
  caddy_config:
